<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandMenu — preview</title></head>
<body>
<div id="root" class="ah" style="padding:24px"></div>
<script>
  var A = window.Ahlawat, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render((function () {
  function Demo() {
    var st = React.useState(false), open = st[0], setOpen = st[1];
    var noop = function () {};
    var groups = [
      { heading: 'Navigate', items: ['Top', 'Experience', 'Work', 'Skills', 'Education', 'Contact'].map(function (l) { return { label: l, icon: 'arrow-right', onSelect: noop }; }) },
      { heading: 'Actions', items: [
        { label: 'Copy email address', icon: 'copy', shortcut: 'abhishekahlawatjeron@gmail.com', onSelect: noop },
        { label: 'Download resume (PDF)', icon: 'arrow-down-to-line', onSelect: noop },
        { label: 'Switch to light theme', icon: 'sun', keywords: ['dark', 'mode'], onSelect: noop }] },
      { heading: 'Elsewhere', items: [{ label: 'LinkedIn', icon: 'external-link', onSelect: noop }, { label: 'GitHub', icon: 'external-link', onSelect: noop }] }];
    return h('div', { style: { display: 'grid', gap: 16, maxWidth: 512 } },
      h('p', { style: { margin: 0, fontSize: 14, color: 'var(--muted-foreground)' } }, 'Press ', h(A.Kbd, null, 'Ctrl / \u2318 K'), ' or ', h(A.Button, { variant: 'ghost', size: 'sm', icon: 'command', onClick: function () { setOpen(true); } }, 'open the dialog')),
      h(A.CommandMenu, { inline: true, groups: groups, placeholder: 'Jump to a section or run an action\u2026', emptyText: 'Nothing matches that.' }),
      h(A.CommandMenu, { open: open, onOpenChange: setOpen, groups: groups, placeholder: 'Jump to a section or run an action\u2026', emptyText: 'Nothing matches that.' }));
  }
  return h(Demo);
})());
</script>
</body>
</html>
